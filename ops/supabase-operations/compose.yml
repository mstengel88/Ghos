name: ghos-operations

services:
  db:
    image: supabase/postgres:17.6.1.136
    container_name: ghos-operations-db
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - operations-db-data:/var/lib/postgresql/data
      - ./.runtime/db/auth-owner.sql:/docker-entrypoint-initdb.d/init-scripts/98-auth-owner.sql:ro
      - ./.runtime/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./.runtime/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=warning
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - operations-internal

  db-bootstrap:
    image: supabase/postgres:17.6.1.136
    container_name: ghos-operations-db-bootstrap
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.runtime/db/bootstrap-roles.sql:/bootstrap/roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec psql --host=db --port=5432 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --file=/bootstrap/roles.sql
    networks:
      - operations-internal

  auth:
    image: supabase/gotrue:v2.189.0
    container_name: ghos-operations-auth
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - operations-internal

  rest:
    image: postgrest/postgrest:v14.12
    container_name: ghos-operations-rest
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - operations-internal

  functions:
    image: supabase/edge-runtime:v1.74.0
    container_name: ghos-operations-functions
    restart: unless-stopped
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    env_file:
      - path: functions.env
        required: true
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_JWKS: '{"keys":[]}'
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      LOADRITE_SYNC_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEYS: '{}'
      SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "true"
      PUBLIC_FUNCTIONS: dump-site-api,dump-site-bridge
    volumes:
      - ./.runtime/functions:/home/deno/functions:ro
      - operations-deno-cache:/root/.cache/deno
    command: ["start", "--main-service", "/home/deno/functions/main"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - operations-internal

  api-gw:
    image: envoyproxy/envoy:v1.38.0
    container_name: ghos-operations-api
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      functions:
        condition: service_healthy
    ports:
      - 127.0.0.1:${OPERATIONS_API_PORT:-18000}:8000
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: disabled
      DASHBOARD_PASSWORD: disabled
    volumes:
      - ./.runtime/api/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./.runtime/api/cds.yaml:/etc/envoy/cds.yaml:ro
      - ./.runtime/api/lds.template.yaml:/etc/envoy/lds.template.yaml:ro
      - ./.runtime/api/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      operations-internal:
        aliases:
          - envoy
          - kong
      ghos-internal:
        aliases:
          - ghos-operations-api

volumes:
  operations-db-data:
    name: ghos-operations-db-data
  operations-deno-cache:
    name: ghos-operations-deno-cache

networks:
  operations-internal:
    name: ghos-operations-internal
  ghos-internal:
    external: true
    name: ghos-internal
