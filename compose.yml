services:
  postgres:
    image: postgres:16
    container_name: ghos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - ghos-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ghos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis:/data
    networks:
      - ghos-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ghos-web:
    build:
      context: ./src/Ghos.Web
      dockerfile: Dockerfile
    container_name: ghos-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Bootstrap__Token: ${GHOS_BOOTSTRAP_TOKEN}
      DataProtection__KeyPath: /var/lib/ghos/data-protection
      AssetStorage__RootPath: /var/lib/ghos/assets
      Shopify__StoreDomain: ${SHOPIFY_STORE_DOMAIN:-darfaz-2e.myshopify.com}
      Shopify__ApiVersion: ${SHOPIFY_API_VERSION:-2026-07}
      Shopify__ClientId: ${SHOPIFY_CLIENT_ID:-}
      Shopify__ClientSecret: ${SHOPIFY_CLIENT_SECRET:-}
      Shopify__StorefrontUrl: https://greenhillssupply.com
      DispatchSync__Enabled: ${DISPATCH_SYNC_ENABLED:-true}
      DispatchSync__IntervalMinutes: ${DISPATCH_SYNC_INTERVAL_MINUTES:-5}
      DispatchSync__InitialDelaySeconds: ${DISPATCH_SYNC_INITIAL_DELAY_SECONDS:-30}
    volumes:
      - ghos-data-protection:/var/lib/ghos/data-protection
      - ./assets:/var/lib/ghos/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ghos-internal

  portainer:
    image: portainer/portainer-ce:latest
    container_name: ghos-portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data

networks:
  ghos-internal:
    name: ghos-internal

volumes:
  ghos-data-protection:
    name: ghos-data-protection
